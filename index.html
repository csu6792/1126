<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>繼電器控制</title>
    <style>
        :root {
            --bg: #000000;
            --grouped-bg: #1c1c1e;
            --card: #2c2c2e;
            --separator: #38383a;
            --label: #ffffff;
            --secondary-label: #8e8e93;
            --blue: #0a84ff;
            --green: #30d158;
            --red: #ff453a;
            --fill: #3a3a3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
            background: var(--bg);
            color: var(--label);
            overscroll-behavior: none;
        }

        body {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* 導航列 */
        .nav-bar {
            padding: 18px 20px 12px;
            padding-top: calc(18px + env(safe-area-inset-top));
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--separator);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-title {
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.4px;
        }

        .nav-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 13px;
            color: var(--secondary-label);
            font-weight: 400;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #8e8e93;
        }

        .status-dot.connected {
            background: var(--green);
        }

        .status-dot.error {
            background: var(--red);
        }

        /* 內容區 */
        .content {
            flex: 1;
            padding: 20px 16px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 連線區塊 */
        .section {
            margin-bottom: 28px;
        }

        .section-header {
            font-size: 13px;
            font-weight: 400;
            color: var(--secondary-label);
            text-transform: uppercase;
            letter-spacing: -0.08px;
            margin: 0 16px 8px;
        }

        .group {
            background: var(--grouped-bg);
            border-radius: 12px;
            overflow: hidden;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            min-height: 44px;
            background: var(--grouped-bg);
            position: relative;
        }

        .cell + .cell::before {
            content: "";
            position: absolute;
            top: 0;
            left: 16px;
            right: 0;
            height: 0.5px;
            background: var(--separator);
        }

        .cell-label {
            font-size: 17px;
            font-weight: 400;
            letter-spacing: -0.4px;
        }

        /* 按鈕 */
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .ios-btn {
            height: 50px;
            border-radius: 12px;
            border: none;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.4px;
            cursor: pointer;
            transition: opacity 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ios-btn:active {
            opacity: 0.65;
        }

        .ios-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .btn-blue {
            background: var(--blue);
            color: white;
        }

        .btn-gray {
            background: var(--fill);
            color: var(--label);
        }

        /* 繼電器卡片 */
        .relay-card {
            background: var(--grouped-bg);
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .relay-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
        }

        .relay-title {
            font-size: 17px;
            font-weight: 400;
            letter-spacing: -0.4px;
        }

        .relay-state {
            font-size: 15px;
            font-weight: 500;
            color: var(--secondary-label);
        }

        .relay-state.on {
            color: var(--green);
        }

        .relay-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--separator);
            border-top: 0.5px solid var(--separator);
        }

        .action-btn {
            background: var(--grouped-bg);
            border: none;
            height: 48px;
            font-size: 17px;
            font-weight: 400;
            color: var(--blue);
            cursor: pointer;
            transition: background 0.15s;
        }

        .action-btn:active {
            background: var(--fill);
        }

        .action-btn:disabled {
            color: var(--secondary-label);
            opacity: 0.5;
            cursor: not-allowed;
        }

        .action-btn.off {
            color: var(--red);
        }

        /* 底部 */
        .footer {
            padding: 12px 20px 24px;
            padding-bottom: calc(24px + env(safe-area-inset-bottom));
            text-align: center;
            font-size: 13px;
            color: var(--secondary-label);
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="nav-title">繼電器控制</div>
        <div class="nav-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">尚未連線</span>
        </div>
    </div>

    <div class="content">
        <!-- 連線 -->
        <div class="section">
            <div class="section-header">連線</div>
            <div class="btn-row">
                <button class="ios-btn btn-blue" id="btnConnect" onclick="connect()">連線</button>
                <button class="ios-btn btn-gray" id="btnDisconnect" onclick="disconnect()" disabled>斷線</button>
            </div>
        </div>

        <!-- 繼電器 -->
        <div class="section">
            <div class="section-header">繼電器</div>

            <!-- 繼電器 1 -->
            <div class="relay-card">
                <div class="relay-header">
                    <div class="relay-title">繼電器 1</div>
                    <div class="relay-state" id="state1">關閉</div>
                </div>
                <div class="relay-actions">
                    <button class="action-btn" id="btn1on" onclick="setRelay(1, true)" disabled>開啟</button>
                    <button class="action-btn off" id="btn1off" onclick="setRelay(1, false)" disabled>關閉</button>
                </div>
            </div>

            <!-- 繼電器 2 -->
            <div class="relay-card">
                <div class="relay-header">
                    <div class="relay-title">繼電器 2</div>
                    <div class="relay-state" id="state2">關閉</div>
                </div>
                <div class="relay-actions">
                    <button class="action-btn" id="btn2on" onclick="setRelay(2, true)" disabled>開啟</button>
                    <button class="action-btn off" id="btn2off" onclick="setRelay(2, false)" disabled>關閉</button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        僅支援 Chrome / Edge 瀏覽器
    </div>

    <script>
        const SERVICE = "12345678-1234-1234-1234-000000000001";
        const COMMAND = "12345678-1234-1234-1234-000000000030";

        let bleDevice = null;
        let commandChar = null;
        let relayState = { 1: false, 2: false };

        function setStatus(text, type = "default") {
            document.getElementById("statusText").textContent = text;
            const dot = document.getElementById("statusDot");
            dot.className = "status-dot";
            if (type === "connected") dot.classList.add("connected");
            if (type === "error") dot.classList.add("error");
        }

        function enableControls(enabled) {
            document.getElementById("btnConnect").disabled = enabled;
            document.getElementById("btnDisconnect").disabled = !enabled;
            ["btn1on", "btn1off", "btn2on", "btn2off"].forEach(id => {
                document.getElementById(id).disabled = !enabled;
            });
        }

        function updateState(num) {
            const el = document.getElementById(`state${num}`);
            if (relayState[num]) {
                el.textContent = "開啟";
                el.classList.add("on");
            } else {
                el.textContent = "關閉";
                el.classList.remove("on");
            }
        }

        async function connect() {
            try {
                setStatus("搜尋裝置中...");
                enableControls(false);

                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: "6792_Device" }],
                    optionalServices: [SERVICE]
                });

                const server = await bleDevice.gatt.connect();
                setStatus("連線中...");

                bleDevice.addEventListener("gattserverdisconnected", () => {
                    setStatus("已斷線");
                    commandChar = null;
                    enableControls(false);
                });

                const service = await server.getPrimaryService(SERVICE);
                commandChar = await service.getCharacteristic(COMMAND);

                setStatus("已連線", "connected");
                enableControls(true);

            } catch (e) {
                console.error(e);
                setStatus("連線失敗", "error");
                enableControls(false);
            }
        }

        function disconnect() {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            }
            commandChar = null;
            setStatus("已斷線");
            enableControls(false);
        }

        async function setRelay(num, on) {
            if (!commandChar) return;

            const cmd = `RELAY${num}:${on ? "ON" : "OFF"}`;
            try {
                await commandChar.writeValue(new TextEncoder().encode(cmd));
                relayState[num] = on;
                updateState(num);
            } catch (e) {
                console.error(e);
                setStatus("指令發送失敗", "error");
            }
        }
    </script>
</body>
</html>
